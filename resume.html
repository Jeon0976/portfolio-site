  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:          #f5f5f7;
      --surface:     #ffffff;
      --ink:         #1d1d1f;
      --muted:       #6e6e73;
      --border:      #d2d2d7;
      --accent:      #0071e3;
      --r-card:      10px;
      --r-btn:       8px;
      --ease-snap:   cubic-bezier(0.2, 0, 0, 1);
      --t:           160ms;
      --max-w:       1120px;
      --font:        "Pretendard Variable", Pretendard, "Inter Tight", -apple-system, sans-serif;
      --mono:        "IBM Plex Mono", ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: var(--font);
      font-size: 1.0625rem;
      line-height: 1.72;
      word-break: keep-all;
      -webkit-font-smoothing: antialiased;
    }

    .wrap { max-width: var(--max-w); margin: 0 auto; padding: 0 24px; }
    .band { background: var(--bg); padding-bottom: 48px; }

    nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 28px 0 0;
    }
    .nav-brand {
      font-size: 0.9375rem; font-weight: 600; color: var(--ink);
      letter-spacing: -0.02em; text-decoration: none;
    }
    .nav-links { display: flex; align-items: center; gap: 28px; list-style: none; }
    .nav-links a {
      font-size: 0.875rem; font-weight: 500; color: var(--muted);
      text-decoration: none; letter-spacing: -0.005em;
      transition: color var(--t) var(--ease-snap); position: relative;
    }
    .nav-links a:not(.nav-cta)::after {
      content: ''; position: absolute; bottom: -3px; left: 0; width: 100%; height: 1px;
      background: currentColor; transform: scaleX(0); transform-origin: left;
      transition: transform 300ms var(--ease-snap);
    }
    .nav-links a:not(.nav-cta):hover::after { transform: scaleX(1); }
    .nav-links a[aria-current="page"]::after { transform: scaleX(1); }
    .nav-links a:hover { color: var(--ink); }
    .nav-links a[aria-current="page"] { color: var(--accent); font-weight: 600; }
    .nav-cta {
      display: inline-flex; align-items: center; padding: 8px 16px;
      background: var(--ink); color: #fff !important;
      font-size: 0.875rem; font-weight: 500; letter-spacing: -0.01em;
      text-decoration: none; border-radius: var(--r-btn);
      transition: opacity 200ms var(--ease-snap);
    }
    .nav-cta:hover { opacity: 0.80; }

    .skip-link {
      position: absolute; left: -10000px; top: 3px;
      background: var(--ink); color: #fff; font-size: 0.875rem; font-weight: 500;
      padding: 8px 16px; border-radius: 4px; text-decoration: none; z-index: 999;
    }
    .skip-link:focus { left: 24px; }

    /* ── Hero ── */
    .hero { padding-top: 56px; display: flex; align-items: flex-end; justify-content: space-between; gap: 32px; flex-wrap: wrap; }
    .eyebrow {
      font-family: var(--font); font-size: 0.75rem; font-weight: 500;
      letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin-bottom: 16px;
    }
    h1 {
      font-size: clamp(2rem, 3.4vw, 2.7rem); font-weight: 500;
      letter-spacing: -0.015em; line-height: 1.28; margin-bottom: 14px;
    }
    .hero-sub { font-size: 1.0625rem; color: var(--muted); max-width: 480px; }

    .hero-actions { display: flex; align-items: center; gap: 20px; padding-bottom: 6px; }
    .btn-primary {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 12px 22px; background: var(--accent); color: #fff;
      font-size: 0.9375rem; font-weight: 500; text-decoration: none;
      border-radius: var(--r-btn); transition: background-color 200ms var(--ease-snap);
    }
    .btn-primary:hover { background: #0059ba; }
    .btn-primary:active { background: #004a99; }
    .btn-text {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 0.9375rem; font-weight: 500; color: var(--accent);
      text-decoration: none; position: relative;
      transition: color 200ms var(--ease-snap);
    }
    .btn-text::after {
      content: ''; position: absolute; bottom: -2px; left: 0; width: 100%; height: 1px;
      background: var(--accent); transform: scaleX(0); transform-origin: left;
      transition: transform 300ms var(--ease-snap);
    }
    .btn-text:hover::after { transform: scaleX(1); }

    /* ── PDF 뷰어 ── */
    .viewer-strip {
      background: var(--surface);
      border-top: 1px solid var(--border);
      padding: 48px 0 72px;
    }
    .pdf-shell {
      max-width: 860px; margin: 0 auto;
      border: 1px solid var(--border); border-radius: var(--r-card);
      overflow: hidden; background: var(--surface);
      box-shadow: 0 1px 2px rgba(29,29,31,0.05);
    }
    .pdf-frame { display: block; width: 100%; height: min(1180px, 128vh); border: 0; }
    .pdf-note {
      max-width: 900px; margin: 14px auto 0;
      font-size: 0.8125rem; color: var(--muted); text-align: center;
    }
    .pdf-note a { color: var(--accent); text-decoration: none; }
    .pdf-note a:hover { text-decoration: underline; }

    footer { border-top: 1px solid var(--border); background: var(--bg); }
    .footer-top {
      display: flex; align-items: center; justify-content: space-between;
      padding: 28px 0 12px; gap: 16px; flex-wrap: wrap;
    }
    .footer-brand { font-size: 0.875rem; font-weight: 600; }
    .footer-nav { display: flex; gap: 20px; list-style: none; }
    .footer-nav a { font-size: 0.8125rem; color: var(--muted); text-decoration: none; }
    .footer-nav a:hover { color: var(--ink); }
    .footer-note { font-size: 0.75rem; color: var(--muted); padding-bottom: 28px; }

    @media (max-width: 720px) {
      .hero { flex-direction: column; align-items: flex-start; }
      .pdf-frame { height: 78vh; }
    }
    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; }
    }
  </style>
